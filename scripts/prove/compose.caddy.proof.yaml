# Proof overrides for compose.caddy.yaml: loopback ports, proof volume names, the fake upstream.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${PROOF_HTTP_PORT}:80"
      - "127.0.0.1:${PROOF_HTTPS_PORT}:${PROOF_HTTPS_PORT}"
  doorward:
    # The gateway reads its public address from .env in a real install; the proof passes it here.
    environment:
      DOORWARD_PUBLIC_URL: ${DOORWARD_PUBLIC_URL}
      DOORWARD_LIMITS_GENERAL_BURST: ${PROOF_GENERAL_BURST:-}
      DOORWARD_LIMITS_GENERAL_PER_MINUTE: ${PROOF_GENERAL_PER_MINUTE:-}
  upstream:
    image: python:3.13-alpine
    command: ["python", "-I", "/opt/fake_upstream.py"]
    environment:
      PROOF_UPSTREAM_SECRET: ${PROOF_UPSTREAM_SECRET}
    volumes:
      - type: bind
        source: ${PROOF_UPSTREAM_SCRIPT}
        target: /opt/fake_upstream.py
        read_only: true
    networks:
      - egress
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  doorward-data:
    name: doorward-proof-data
  caddy-data:
    name: doorward-proof-caddy-data
  caddy-config:
    name: doorward-proof-caddy-config
