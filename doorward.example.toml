# Public address of the gateway: scheme and host only.
public_url = "https://gateway.example.com"
listen = "127.0.0.1:8717"
database = "doorward.db"

# The proxy or tunnel in front of the gateway. Loopback fits one that runs on this host.
trusted_proxies = ["127.0.0.1", "::1"]

# Origins other than the public address that may call the MCP paths, such as a browser
# extension. Each entry is compared exactly.
# allowed_origins = ["chrome-extension://abcdefghijklmnop"]

# Lifetimes of invitations, links, sessions and tokens.
[lifetimes]
# invitation_days = 7
# reset_minutes = 60
# session_hours = 12
# auth_request_minutes = 10
# auth_code_seconds = 60
# access_token_minutes = 60
# refresh_token_days = 30
# family_days = 90
# refresh_replay_seconds = 30

# Request size, upstream time and attempt limits.
[limits]
# body_bytes = 1048576
# body_read_seconds = 15
# tools_list_bytes = 4194304
# answer_memory_bytes = 33554432
# upstream_timeout_seconds = 300
# account_failures = 5
# account_ceiling = 50
# address_failures = 30
# block_minutes = 15
# dcr_per_hour = 60
# unused_registrations = 10000
# activity_days = 90
# catalog_refresh_seconds = 30

# Outgoing mail.
[mail]
# smtp_ca_file = "roots.pem"
