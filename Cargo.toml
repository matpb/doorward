[package]
name = "doorward"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.8", features = ["derive"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
maud = "0.27.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "1.2.1"
url = "2.5.8"
zeroize = "1.9.2"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
multer = "3.1.0"
rand = "0.10.4"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
scraper = "0.29.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
url = "2.5.8"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
